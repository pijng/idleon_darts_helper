[project]
name = "dartbot"
version = "0.1.0"
description = "Vision bot for the Throwy Darts minigame in Legends of Idleon"
# 3.11+: time.sleep uses high-resolution timers on Windows (click timing needs ~1 ms)
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "mss>=10.2",
    "pynput>=1.7",
]

[project.scripts]
dartbot = "dartbot.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dartbot*"]

[tool.setuptools.package-data]
dartbot = ["assets/*.png", "assets/glyphs/*.png"]
