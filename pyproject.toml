[project]
name = "dartbot"
version = "0.1.0"
description = "Vision bot for the Throwy Darts minigame in Legends of Idleon"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "mss>=10.2",
    "pynput>=1.7",
]

[project.scripts]
dartbot = "dartbot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dartbot*"]

[tool.setuptools.package-data]
dartbot = ["assets/*.png", "assets/glyphs/*.png"]
